name: Sync develop after release

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: sync-develop
  cancel-in-progress: false

jobs:
  sync:
    name: Sync main into develop
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          ssh-key: ${{ secrets.DEVELOP_SYNC_SSH_KEY }}
      - name: Synchronize without rewriting history
        env:
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          RELEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE_PR: ${{ github.event.pull_request.number }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/sync-development-branch.sh "$RELEASE_SHA" "$RELEASE_HEAD_SHA" "$RELEASE_PR"
